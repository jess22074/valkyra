<ActionBar title="Detalle"></ActionBar>

<StackLayout padding="20">

  <Label
    text="Detalle del elemento"
    fontSize="24"
    fontWeight="bold"
    marginBottom="20">
  </Label>

  <Label
    [text]="'ID seleccionado: ' + id"
    fontSize="18">
  </Label>

  <Label
  text="Recursos de aprendizaje"
  fontSize="20"
  fontWeight="bold"
  marginTop="20"
  marginBottom="10">
</Label>


<RadListView
  [items]="recursos"
  pullToRefresh="true"
  (pullToRefreshInitiated)="onPullToRefresh($event)"
  height="500">

  <ng-template let-recurso="item">

    <GridLayout
      columns="*, auto"
      rows="auto, auto, auto"
      padding="10">

      <Label
        row="0"
        col="0"
        [text]="recurso.titulo"
        fontSize="18"
        fontWeight="bold">
      </Label>

      <Label
        row="1"
        col="0"
        [text]="recurso.descripcion"
        fontSize="15">
      </Label>

      <Label
        row="2"
        col="0"
        [text]="recurso.nivel"
        fontSize="13">
      </Label>

    

    <StackLayout
  row="0"
  col="1"
  rowSpan="3"
  orientation="horizontal"
  verticalAlignment="middle">

  <Label
  text="👍"
  fontSize="22"
  margin="8"
  (tap)="mostrarAlerta(recurso, 'positivo')">
</Label>


  <Label
  text="👎"
  fontSize="22"
  margin="8"
  (tap)="mostrarAlerta(recurso, 'negativo')">
</Label>

<Label
  text="✏️"
  fontSize="22"
  margin="8"
  (tap)="editarNivel(recurso)">
</Label>

</StackLayout>

</GridLayout>

  </ng-template>

</RadListView>


</StackLayout>
